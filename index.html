<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love App 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Loading Screen ── -->
  <div id="loading-screen">
    <div id="loading-heart">❤️</div>
    <h1 id="loading-title">Love App</h1>
  </div>

  <!-- ── Floating Heart Particles ── -->
  <div id="particles-container" aria-hidden="true"></div>

  <!-- ── Theme Toggle ── -->
  <button id="theme-toggle" aria-label="Toggle theme">
    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
    <svg id="icon-sun"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>

  <!-- ── App Shell (hidden until load) ── -->
  <div id="app">
    <main id="main-content">
      <div id="section-home"    class="section" data-name="home"></div>
      <div id="section-songs"   class="section" data-name="songs"></div>
      <div id="section-gallery" class="section" data-name="gallery"></div>
      <div id="section-extras"  class="section" data-name="extras"></div>
      <div id="section-games"   class="section" data-name="games"></div>
    </main>

    <!-- ── Bottom Nav ── -->
    <nav id="bottom-nav">
      <div class="nav-inner">
        <button class="nav-btn active" data-section="home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-section="songs" aria-label="Songs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Songs</span>
        </button>
        <button class="nav-btn" data-section="gallery" aria-label="Gallery">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
          <span>Gallery</span>
        </button>
        <button class="nav-btn" data-section="extras" aria-label="Extras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
          <span>Extras</span>
        </button>
        <button class="nav-btn" data-section="games" aria-label="Games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="17" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
          <span>Games</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- ── Gallery Lightbox ── -->
  <div id="lightbox" aria-modal="true" role="dialog">
    <button id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt="Full size photo" />
  </div>

  <!-- ── Add Note Modal ── -->
  <div id="note-modal" aria-modal="true" role="dialog">
    <div class="note-modal-backdrop"></div>
    <div class="note-modal-card glass-panel">
      <div class="note-modal-header">
        <h3>New Love Note</h3>
        <button id="note-modal-cancel">Cancel</button>
      </div>
      <textarea id="note-textarea" placeholder="Type something sweet..." rows="4"></textarea>
      <div id="note-colors" class="note-colors"></div>
      <button id="note-save" class="btn-primary w-full">Save Note</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
